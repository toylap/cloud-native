# 최적의 설정은 없습니다.
# 기본적으로 처리되는 값이 있긴해도 리소스에 맞는 설정은 모니터링하여 설정값을 설정해야합니다.

server:
  port: 8000
  tomcat:
    connection-timeout: 2s # HTTP 요청을 받기까지 tomcat 대기 시간
    keep-alive-timeout: 15s # HTTP 요청 대기 시간 제어 / 시간이 지나면 새 연결 후 진행
    threads:
      max: 50
      min-spare: 5
spring:
  application:
    name: merch-service
  config:
    import: "optional:configserver:"
  cloud:
    config:
      uri: http://localhost:8889
      request-connect-timeout: 5000
      request-read-timeout: 5000
      fail-fast: true # retry
      retry:
        max-attempts: 6 # 최대 시도
        initial-interval: 1000 # 첫 시도 간격
        max-interval: 2000 # 최고 간격
        multiplier: 1.1 # 승수, 배수

management:
  endpoints:
    web:
      expourse:
        include: refresh

merch:
  greeting: Hello World!